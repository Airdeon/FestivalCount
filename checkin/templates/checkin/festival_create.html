{% extends "checkin/base.html" %}
{% block title %}Créer un festival — Festival Count{% endblock %}
{% block back_link %}
<a href="{% url 'checkin:select_festival' %}?all=1" class="nav-back">← Mes festivals</a>
{% endblock %}
{% block content %}
<div class="page-card">
    <h1>Créer un festival</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Créer</button>
    </form>
</div>
{% endblock %}
