{% extends "checkin/base.html" %}
{% block title %}Connexion — Festival Count{% endblock %}
{% block content %}
<div class="page-card">
    <h1>Connexion</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Se connecter</button>
    </form>
    <p><a href="{% url 'checkin:signup' %}">Créer un compte</a></p>
</div>
{% endblock %}
